version: "3.9"

services:
  server:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: server
    image: fts-server:latest
    container_name: fts-server
    ports:
      - "${FTS_PORT:-9000}:9000"
    environment:
      FTS_HOST: "0.0.0.0"
      FTS_PORT: "9000"
    volumes:
      - server_storage:/app/server_storage
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c",
             "import socket; s=socket.create_connection(('localhost',9000),2); s.close()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  client:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: client
    image: fts-client:latest
    depends_on:
      server:
        condition: service_healthy
    environment:
      FTS_HOST: server
      FTS_PORT: "9000"
    volumes:
      - ./data:/data:ro
      - received_data:/received
    profiles:
      - client

volumes:
  server_storage:
  received_data:
